<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd6e7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<title>💗 Reyyan'ın Testi</title>
<style>
:root{--tx:#5a2a42;--mu:#b07f98;--ac:#ff6fa5;--ac2:#d6336f;--bd:#ffd3e4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 'Nunito','Quicksand',ui-rounded,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--tx);background-color:#fff5f9;background-image:radial-gradient(#ffd3e4 1.4px,transparent 1.5px),linear-gradient(180deg,#ffe6f1,#fff5f9 45%,#ffeaf4);background-size:24px 24px,100% 100%;background-attachment:fixed;overflow-x:hidden}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:16px}
.hero{text-align:center;margin:8px 0 14px}
.mascot{display:inline-block;font-size:64px;animation:bounce 2s ease-in-out infinite;cursor:pointer;user-select:none;filter:drop-shadow(0 6px 6px #ff6fa533)}
h1{font-size:28px;margin:2px 0;color:var(--ac2);text-shadow:2px 2px 0 #ffd3e4}
.card{position:relative;background:#fffdfe;border:2px solid var(--bd);border-radius:26px;padding:18px;margin-bottom:22px;box-shadow:0 7px 0 #ffe3ef,0 14px 24px #ff6fa51f}
.card::after{content:'💗';position:absolute;top:-13px;right:18px;font-size:22px;animation:wig 3s ease-in-out infinite}
.note{font-size:13px;color:var(--mu)}
.big{font-size:44px;font-weight:700;color:var(--ac2);text-align:center;margin:6px 0}
.center{text-align:center}
button{font:inherit;font-weight:600;color:#fff;background:linear-gradient(135deg,#ff9ec4,#ff5c9a);border:0;border-radius:999px;padding:12px 26px;cursor:pointer;box-shadow:0 4px 0 #e0457f,0 8px 14px #ff5c9a40;transition:transform .12s,box-shadow .12s}
button:hover{transform:translateY(-2px) rotate(-1deg)}button:active{transform:translateY(3px);box-shadow:0 1px 0 #e0457f}
button.ghost{background:#fff;color:var(--ac2);border:2px solid var(--bd);box-shadow:0 4px 0 #ffd3e4}
.bar{height:14px;background:#ffe6f0;border-radius:99px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb3d1,#ff5c9a);border-radius:99px;transition:width .4s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);margin-bottom:10px}
.q{font-size:19px;font-weight:600;color:var(--ac2);margin:8px 0 14px}
.opt{display:block;width:100%;text-align:left;background:#fff;color:var(--tx);border:2px solid var(--bd);box-shadow:0 4px 0 #ffd3e4;border-radius:20px;padding:12px 16px;margin:10px 0;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt:disabled{cursor:default;transform:none}
.opt.ok{background:#dcf8e8;border-color:#4cc38a;box-shadow:0 4px 0 #b6ecd0}
.opt.no{background:#ffe3e7;border-color:#ff7a8a;box-shadow:0 4px 0 #ffc4cb}
.fb{background:#fff0f6;border:2px dashed #ffc2da;border-radius:18px;padding:10px 14px;margin:12px 0}
.wr{font-size:14px;margin:8px 0;padding:8px 12px;background:#fff0f6;border-radius:14px}
.hide{display:none}
.fl{position:fixed;bottom:-40px;z-index:0;pointer-events:none;opacity:.7;animation:fly linear infinite}
.cf{position:fixed;top:-30px;z-index:9;pointer-events:none;animation:fall 3s ease-in forwards}
@keyframes fly{to{transform:translateY(-115vh) rotate(40deg)}}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px) rotate(4deg)}}
@keyframes wig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
<div class="hero">
  <span class="mascot" onclick="burst();this.textContent=['🐰','🐻','🐱','🦄','🐥','🐼'][Math.floor(Math.random()*6)]">🐰</span>
  <h1>Reyyan'ın Testi</h1>
</div>

<div class="card center" id="start">
  <p style="margin-top:0">Reyyan'ı ne kadar tanıyorsun? 🎀<br>20 soru, hepsi sohbetten çıkarıldı. Şıklar birbirine çok yakın, dikkat! 😏</p>
  <p class="note" id="best"></p>
  <button id="go">Başlayalım 💗</button>
</div>

<div class="card hide" id="quiz">
  <div class="bar"><i id="pb"></i></div>
  <div class="meta"><span id="no"></span><span id="sc"></span></div>
  <div class="q" id="qt"></div>
  <div id="opts"></div>
  <div class="fb hide" id="fb"></div>
  <p class="center"><button id="next" class="hide">Sonraki ➜</button></p>
</div>

<div class="card hide center" id="res">
  <div style="font-size:54px" id="re"></div>
  <div class="big" id="rs"></div>
  <p id="rt" style="margin-top:0"></p>
  <p><button id="again">Tekrar dene 🔁</button></p>
</div>

</main>

<script>
const $=id=>document.getElementById(id);
/* o[0] = doğru cevap, n = sohbetten not */
const Q=[
{q:"Reyyan'ın hayalindeki ev hangisi?",o:["Ahşap ev","Taş ev","Bağ evi","Köy evi"],n:"Ahşap ev hayaline gülünmesine kızıyor, \"hayalim\" diyor."},
{q:"Reyyan hangi Winx perisi olmak istiyor?",o:["Bloom","Stella","Flora","Musa"],n:"\"Bloom olmak istiyorum\" demiş."},
{q:"Reyyan hangi büyülü dünyayı seviyor?",o:["Harry Potter","Percy Jackson","Narnia","Yüzüklerin Efendisi"],n:"Harry Potter sevdiğini ve Snape'i anlatmış."},
{q:"Reyyan hangi diziyi izleyeceğini söyledi?",o:["Legacies","Riverdale","Teen Wolf","Gossip Girl"],n:"\"The Legacies izlicem\" demiş."},
{q:"Reyyan hangi Hogwarts evinde olmak istiyor?",o:["Slytherin","Gryffindor","Ravenclaw","Hufflepuff"],n:"\"Slytherin'den olmak, istiyom\" demiş."},
{q:"Reyyan'ın \"mükemmel dizi\" dediği çizgi dizi hangisi?",o:["Esrarengiz Kasaba","Gumball","Rick and Morty","Phineas ve Ferb"],n:"Esrarengiz Kasaba için \"aslında mükemmel dizi ya\" demiş."},
{q:"Reyyan hangi çizgi diziye başlamak istediğini söyledi?",o:["Prenses Sofia","Elena","Rapunzel","Barbie"],n:"\"Prenses Sofia'ya başlamak istiyorum\" demiş."},
{q:"Reyyan şu sıralar hangi diziyi izliyor?",o:["The Originals","Supernatural","Shadowhunters","True Blood"],n:"\"The Originals bitince\" diyor, yani sırada o var."},
{q:"Reyyan hangi yemeği \"çok zevkli\" buluyor?",o:["Balık","Tavuk","Köfte","Kebap"],n:"\"Bence balık yemek çok zevkli\" demiş."},
{q:"Reyyan hangi içeceğin tadını sevmiyor?",o:["Kola","Fuse Tea","Ice Tea","Limonata"],n:"Kola için \"içme\", \"tadı da kötü\" demiş. Alternatif olarak Fuse Tea'yi önermiş."},
{q:"Reyyan videoları en çok hangi uygulamadan paylaşıyor?",o:["TikTok","Instagram","YouTube","Snapchat"],n:"Sohbette en çok TikTok linki atmış (80'den fazla)."},
{q:"Reyyan müzik linklerini hangi uygulamadan paylaşıyor?",o:["Spotify","YouTube Music","Deezer","Apple Music"],n:"Spotify linki atmış."},
{q:"Reyyan hangi cihazı istediğini söyledi?",o:["PC","Konsol","Tablet","Laptop"],n:"\"Ben pc istiyorum, sadece oyun deneyimi istiyorum\" demiş."},
{q:"Reyyan hangi rapçi için \"iyi\" dedi?",o:["Uzi","Sagopa","Ceza","Ezhel"],n:"Uzi'ye \"iyi\" demiş. Sagopa için ise \"sarmıyor ki\" demiş."},
{q:"Reyyan'ın kediden korkan yakını kim?",o:["Ablası","Annesi","Babaannesi","Teyzesi"],n:"\"Ablam kediden korkar\" demiş."},
{q:"Reyyan hangi karakterli çift üstleri çok istiyor?",o:["Spider-Man","Batman","Superman","Hello Kitty"],n:"\"Çift spiderman üstlerini çok istiyom\" demiş."},
{q:"Reyyan en çok hangi emojiyi kullanıyor?",o:["😭","😞","😛","🙏"],n:"😭 yaklaşık 395 kez, sonra 😛 ve 😞 geliyor."},
{q:"Reyyan en çok hangi kelimeyi kullanıyor?",o:["olum","niye","neden","güzel"],n:"\"olum\" yaklaşık 650 kez yazılmış, \"niye\" yaklaşık 215."},
{q:"Reyyan kış gelince hangi keki yapacağını söyledi?",o:["Havuçlu tarçınlı kek","Elmalı tarçınlı kek","Muzlu cevizli kek","Portakallı kek"],n:"\"Kış gelince havuçlu tarçınlı kek yapcam\" demiş."},
{q:"Reyyan hangi dersten kaldığını söyledi ve neden zor buldu?",o:["Felsefe: hep ezber","Tarih: tarihler çok","Edebiyat: çok okuma var","Coğrafya: haritalar"],n:"\"Felsefeden kaldım\", \"felsefe hep ezber\" demiş."}
];

function bgHearts(){const E=['💗','✨','🌸','🎀','💖','🫧','🌷','⭐'];for(let i=0;i<16;i++){const s=document.createElement('span');s.className='fl';s.textContent=E[i%E.length];s.style.cssText=`left:${Math.random()*96}%;font-size:${14+Math.random()*18}px;animation-duration:${9+Math.random()*10}s;animation-delay:${-Math.random()*14}s`;document.body.appendChild(s)}}
function burst(){const E=['💗','🎀','🌸','✨','💖','🍓','🧸'];for(let i=0;i<32;i++){const s=document.createElement('span');s.className='cf';s.textContent=E[i%E.length];s.style.cssText=`left:${Math.random()*95}%;font-size:${16+Math.random()*16}px;animation-delay:${Math.random()*0.8}s;animation-duration:${2.2+Math.random()*1.8}s`;document.body.appendChild(s);setTimeout(()=>s.remove(),5200)}}
bgHearts();

let idx=0,score=0,cur=null,wrong=[],locked=false;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function getBest(){try{return localStorage.getItem("retest-best")}catch(e){return null}}
function setBest(v){try{const b=+getBest()||0;if(v>b)localStorage.setItem("retest-best",v)}catch(e){}}
function showBest(){const b=getBest();$("best").textContent=b!==null?"En iyi puanın: "+b+" / "+Q.length+" 🏆":""}
showBest();

function begin(){idx=0;score=0;wrong=[];$("start").classList.add("hide");$("res").classList.add("hide");$("quiz").classList.remove("hide");show()}
function show(){
  locked=false;const q=Q[idx];
  cur={q:q.q,n:q.n,ans:q.o[0],opts:shuffle(q.o)};
  $("no").textContent="Soru "+(idx+1)+" / "+Q.length;
  $("sc").textContent="Puan: "+score+" ⭐";
  $("pb").style.width=(idx/Q.length*100)+"%";
  $("qt").textContent=cur.q;
  $("opts").innerHTML="";
  cur.opts.forEach(t=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>pick(b,t);$("opts").appendChild(b)});
  $("fb").classList.add("hide");$("next").classList.add("hide");
}
function pick(btn,t){
  if(locked)return;locked=true;
  const ok=t===cur.ans;
  [...$("opts").children].forEach(b=>{b.disabled=true;if(b.textContent===cur.ans)b.classList.add("ok")});
  if(ok){score++;$("sc").textContent="Puan: "+score+" ⭐"}else{btn.classList.add("no");wrong.push({q:cur.q,a:cur.ans,y:t})}
  $("fb").textContent=(ok?"Doğru! 🎉 ":"Olmadı 🥺 ")+cur.n;
  $("fb").classList.remove("hide");
  $("next").textContent=idx===Q.length-1?"Sonucu gör 💗":"Sonraki ➜";
  $("next").classList.remove("hide");
}
function finish(){
  $("quiz").classList.add("hide");$("res").classList.remove("hide");
  $("pb").style.width="100%";setBest(score);showBest();
  const r=score<=5?["🐣","Yeni tanışmışsınız gibi","Reyyan'ı daha yeni tanıyorsun, sohbetleri biraz daha oku 😅"]:score<=10?["🌱","Tanışma aşaması","Bazı şeyleri biliyorsun ama daha keşfedecek çok şey var 🌸"]:score<=15?["🎀","İyi bir arkadaş","Reyyan'ı gayet iyi tanıyorsun, ufak detaylar kaçmış 💕"]:score<=19?["💖","Reyyan uzmanı!","Neredeyse hepsini bildin, Reyyan'ın gölgesi gibisin ✨"]:["👑","Mükemmel!","20/20! Reyyan'ı herkesten iyi tanıyorsun 💗"];
  $("re").textContent=r[0];$("rs").textContent=score+" / "+Q.length;
  $("rt").innerHTML="";const b=document.createElement("b");b.textContent=r[1];$("rt").appendChild(b);$("rt").appendChild(document.createElement("br"));$("rt").appendChild(document.createTextNode(r[2]));
  if(score>=15)burst();
}
$("go").onclick=begin;
$("again").onclick=begin;
$("next").onclick=()=>{if(idx===Q.length-1)finish();else{idx++;show();window.scrollTo({top:0,behavior:"smooth"})}};
</script>
</body>
</html>
